<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Chat Colors</title>
  <link rel="stylesheet" href="../src/content.css">
  <style>
    :root {
      --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --line: rgba(0,0,0,.12); --hover: rgba(0,0,0,.06);
      --on-bg: #1f1f1f; --on-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #262624; --fg: #f1efe8; --muted: #a8a59c; --line: rgba(255,255,255,.14); --hover: rgba(255,255,255,.08);
              --on-bg: #f1efe8; --on-fg: #1f1f1f; }
    }
    body { margin: 0; width: 380px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, sans-serif; }
    section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    section:last-child { border-bottom: none; }
    section[hidden] { display: none; }
    h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .current { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .big { flex: none; width: 36px; height: 36px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
    .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub { font-size: 12px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
    button.act { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    button.act:hover { background: var(--hover); }
    button.link { font: inherit; font-size: 11px; border: none; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; text-transform: none; letter-spacing: 0; }
    .seg { display: inline-flex; margin-bottom: 10px; }
    .seg button { font: inherit; font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    .seg button:first-child { border-radius: 6px 0 0 6px; }
    .seg button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
    .seg button.on { background: var(--on-bg); color: var(--on-fg); border-color: var(--on-bg); }
    .ccc-palette button.ccc-pal-swatch.ccc-selected { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
    label.opt { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 170px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    li .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; }
    li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .meta { flex: none; font-size: 11px; color: var(--muted); }
    li button.x { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
    li button.x:hover { color: var(--fg); }
    li.clickable { cursor: pointer; border-radius: 6px; padding: 4px 6px; margin: 0 -6px; }
    li.clickable:hover { background: var(--hover); }
    .badge { flex: none; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; line-height: 18px; }
    .badge.done { background: #16a34a; color: #fff; }
    .badge.run { border: 1.5px solid var(--muted); color: var(--muted); line-height: 15px; }
    .empty { color: var(--muted); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .time-line { display: flex; align-items: baseline; gap: 8px; }
    .time-total { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .time-now { font-size: 12px; color: var(--muted); }
    .time-now.paused { color: var(--fg); }
    .time-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 6px; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 12px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <section>
    <h2>This chat</h2>
    <div id="current"></div>
  </section>
  <section id="activity-section" hidden>
    <h2><span>Activity</span><button class="link" id="mark-seen">Mark all as seen</button></h2>
    <ul id="activity"></ul>
  </section>
  <section id="time-section">
    <h2><span>Time today</span><button class="link" id="time-open">View breakdown</button></h2>
    <div class="time-line"><span class="time-total" id="time-total">0s</span><span class="time-now" id="time-now"></span></div>
    <div class="time-actions" id="time-actions"></div>
  </section>
  <section>
    <h2>Show</h2>
    <label class="opt"><input type="checkbox" data-setting="topbar"> Color bar at top of page</label>
    <label class="opt"><input type="checkbox" data-setting="composer"> Glow around message box</label>
    <label class="opt"><input type="checkbox" data-setting="sidebar"> Sidebar colors + running / done markers</label>
    <label class="opt"><input type="checkbox" data-setting="tint"> Faint page tint</label>
    <label class="opt"><input type="checkbox" data-setting="groupByProject"> Chats in a project share its color (older = fainter)</label>
    <div class="hint">Sidebar: spinner = Claude is answering. Green "✓ Done" = finished and you haven't opened it yet. Alt+click any chat to recolor it.</div>
  </section>
  <section>
    <h2>Your colors</h2>
    <ul id="custom"></ul>
  </section>
  <footer>
    <span id="version"></span>
    <button class="link" id="diag">Copy diagnostics</button>
  </footer>
  <script src="../src/colors.js"></script>
  <script src="../src/activity.js"></script>
  <script src="../src/storage.js"></script>
  <script src="../src/palette-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
