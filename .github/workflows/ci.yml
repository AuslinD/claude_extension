name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifest and versions agree
        run: node -e "const m=require('./manifest.json'),p=require('./package.json'); if(m.version!==p.version){console.error('manifest.json',m.version,'!= package.json',p.version);process.exit(1)}"
      - run: npm test

  # Push a tag like v1.2.0 to publish a downloadable zip on the Releases page.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/package.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
